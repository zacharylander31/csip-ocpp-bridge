name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # What the Docker image runs: tsc to dist/.
      - run: npm run build

      - name: config-test (config loader)
        run: npm run config-test
        timeout-minutes: 3

      # Demos run one after another, so timing-sensitive checks don't compete
      # for CPU. Each exits non-zero on failure, which fails the job. The
      # per-step timeout catches a demo that hangs instead of exiting.
      # `npm run mock-csip` is left out: it serves until stopped.
      - name: demo (OCPP cap and recover)
        run: npm run demo
        timeout-minutes: 3
      - name: check-csip (CSIP-AUS client)
        run: npm run check-csip
        timeout-minutes: 3
      - name: bridge-demo (end to end, two chargers)
        run: npm run bridge-demo
        timeout-minutes: 3
      - name: failsafe-demo (comms loss)
        run: npm run failsafe-demo
        timeout-minutes: 3
      - name: telemetry-demo (posting readings back)
        run: npm run telemetry-demo
        timeout-minutes: 3
      - name: site-demo (site meter)
        run: npm run site-demo
        timeout-minutes: 3
      - name: site-meter-demo (main.ts with ODE's meter, house load, meter silent)
        run: npm run site-meter-demo
        timeout-minutes: 4
      - name: ode-demo (limits from Open Dynamic Export over MQTT)
        run: npm run ode-demo
        timeout-minutes: 3
      - name: ocpp16-demo (OCPP 1.6J and 2.0.1 chargers)
        run: npm run ocpp16-demo
        timeout-minutes: 3
      - name: amps-demo (amps, three phase, 6 A minimum)
        run: npm run amps-demo
        timeout-minutes: 3
      - name: reconnect-demo (cap re-sent after reboot or reconnect)
        run: npm run reconnect-demo
        timeout-minutes: 3
      - name: runtime-demo (npm start from config, real SIGTERM)
        run: npm run runtime-demo
        timeout-minutes: 3
      - name: sp1-demo (charger passwords, OCPP Security Profile 1)
        run: npm run sp1-demo
        timeout-minutes: 3
      - name: sim-reconnect-demo (simulated charger survives a bridge restart)
        run: npm run sim-reconnect-demo
        timeout-minutes: 3
      # The README's demo: mock network + src/main.ts + one charger, ~60 s.
      - name: showcase (the README demo, network -> bridge -> charger)
        run: npm run showcase
        timeout-minutes: 4

  # Separate job: a Docker problem shouldn't hide the demo results, and this
  # is the only place the Docker files get checked (ubuntu-latest has Docker).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The compose file mounts the site's own config files, which aren't in
      # the repo; use the examples so it validates and the image can --check.
      - name: Prepare example config
        run: |
          cp config.example.json config.json
          mkdir -p ode/config
          cp ode/config.example.json ode/config/config.json

      - name: docker compose config
        run: docker compose config --quiet

      - name: docker build
        run: docker build -t csip-ocpp-bridge:ci .

      - name: Image validates the example config
        # Same mount as docker-compose.yml; BRIDGE_CONFIG in the image points at it.
        run: docker run --rm -v "$PWD/config.json:/config/config.json:ro" csip-ocpp-bridge:ci node dist/main.js --check

      # The real stack: `docker compose up` with the real ODE image, against
      # the mock CSIP-AUS server on the runner (src/runOdeLive.ts).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prepare the stack's config (CI files, public test certificates)
        run: |
          cp ci/bridge.config.json config.json
          mkdir -p ode/config ode/logs
          cp ci/ode.config.json ode/config/config.json
          cp test-certs/ode-device.cert.pem ode/config/cert.pem
          cp test-certs/ode-device.key.pem ode/config/key.pem

      - name: docker compose build and pull
        run: |
          docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml build
          docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml pull mosquitto open-dynamic-export

      - name: ode-live (docker compose up, real ODE, network -> charger)
        timeout-minutes: 6
        # The mock server must be up before ODE starts: ODE retries a failed
        # first poll only after minutes. So the check starts first, in the
        # background, then the stack.
        run: |
          npm run ode-live -- --compose &
          check=$!
          sleep 3
          docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml up -d
          wait $check

      - name: Stack logs
        if: always()
        run: |
          docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml ps
          docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml logs --no-color --tail 150
          docker compose -f docker-compose.yml -f ci/docker-compose.ci.yml down
