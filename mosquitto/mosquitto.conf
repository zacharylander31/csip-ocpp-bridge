# MQTT broker between Open Dynamic Export (publishes limits) and the bridge
# (reads them). Used by docker-compose.yml.
#
# Anonymous access is allowed because docker-compose.yml does NOT publish
# port 1883: only containers on the compose network (ODE and the bridge) can
# reach the broker. If you publish the port, or use a broker other devices
# can reach, add a password_file and set BRIDGE_MQTT_PASSWORD for the bridge.
listener 1883
allow_anonymous true

# Limits are re-published every second and never retained, so nothing is
# worth keeping across restarts.
persistence false
log_dest stdout
